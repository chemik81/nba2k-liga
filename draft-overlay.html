<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏀 NBA 2K Liga — Draft Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --gold:   #f5c518;
  --dark:   #0a0c10;
  --dark2:  #10131a;
  --dark3:  #161922;
  --dark4:  #1d2130;
  --border: rgba(245,197,24,.15);
  --text:   #e8eaf0;
  --muted:  #6b7080;
  --green:  #4ade80;
  --red:    #f87171;
  --orange: #fb923c;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 1920px; height: 1080px;
  overflow: hidden;
  background: var(--dark);
  color: var(--text);
  font-family: 'Barlow', sans-serif;
  font-size: 14px;
}

/* ── TOP BAR ── */
.topbar {
  background: var(--dark2);
  border-bottom: 2px solid var(--gold);
  padding: 10px 28px;
  display: flex;
  align-items: center;
  gap: 16px;
  height: 54px;
  flex-shrink: 0;
}
.live-dot {
  width: 9px; height: 9px; border-radius: 50%;
  background: var(--green); animation: pulse 1.4s infinite; flex-shrink: 0;
}
.topbar-logo {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 900; color: var(--gold);
  letter-spacing: .12em; text-transform: uppercase;
}
.topbar-title {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 20px; font-weight: 900; color: var(--text);
  letter-spacing: .04em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 600px;
}
.topbar-status {
  font-size: 11px; color: var(--muted);
  text-transform: uppercase; letter-spacing: .1em;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 4px; padding: 2px 8px;
}
.topbar-status.live { color: var(--green); border-color: rgba(74,222,128,.3); }
.topbar-status.paused { color: var(--orange); border-color: rgba(251,146,60,.3); }

/* ── OTC strip ── */
.otc-strip {
  margin-left: auto;
  display: flex; align-items: center; gap: 18px;
}
.otc-label { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.otc-team-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 22px; font-weight: 900; color: var(--gold);
  white-space: nowrap;
}
.otc-pick-info { font-size: 11px; color: var(--muted); }
.timer-big {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 42px; font-weight: 900; color: var(--gold);
  line-height: 1; min-width: 90px; text-align: center;
  transition: color .3s;
}
.timer-big.urgent { color: var(--red); animation: urgentPulse .5s infinite alternate; }
.timer-big.warning { color: var(--orange); }

.last-pick-strip {
  display: flex; flex-direction: column; align-items: flex-end;
}
.last-pick-lbl { font-size: 9px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; }
.last-pick-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 18px; font-weight: 900; color: var(--green); white-space: nowrap;
}
.last-pick-team { font-size: 10px; color: var(--muted); }

/* ── MAIN ── */
.page {
  display: flex; flex-direction: column;
  height: 1080px;
}

/* ── TICKER ── */
.ticker {
  background: var(--dark3);
  border-bottom: 1px solid var(--border);
  padding: 5px 0;
  overflow: hidden; white-space: nowrap;
  flex-shrink: 0;
}
.ticker-inner { display: inline-block; animation: ticker 35s linear infinite; padding-left: 100%; }
.ticker-item {
  display: inline-block; margin: 0 24px;
  font-size: 12px; font-weight: 600;
}
.ticker-item .tn { color: var(--muted); font-size: 10px; }
.ticker-item .tp { color: var(--text); }
.ticker-item .tt { color: var(--gold); }

/* ── BOARD SECTION ── */
.board-section {
  flex: 1; padding: 16px 24px 10px;
  display: flex; flex-direction: column; gap: 10px;
  overflow: hidden;
}
.board-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 13px; font-weight: 700;
  letter-spacing: 1.5px; color: var(--muted);
  text-transform: uppercase;
  display: flex; align-items: center; gap: 8px;
}

.board-grid {
  display: grid;
  gap: 14px;
  flex: 1;
  align-items: start;
}

/* ── TEAM CARD ── */
.team-card {
  background: var(--dark2);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  transition: border-color .3s, box-shadow .3s;
}
.team-card.otc {
  border-color: var(--gold);
  box-shadow: 0 0 20px rgba(245,197,24,.2);
}
.team-card-head {
  background: var(--dark3);
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 10px;
}
.team-logo {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--dark4);
  border: 2px solid rgba(245,197,24,.2);
  display: flex; align-items: center; justify-content: center;
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 16px; color: var(--gold);
  overflow: hidden; flex-shrink: 0;
}
.team-logo img { width: 100%; height: 100%; object-fit: cover; }
.team-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 17px; font-weight: 900;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1;
}
.captain-tag { font-size: 11px; color: var(--muted); }
.online-dot {
  width: 7px; height: 7px; border-radius: 50%;
  flex-shrink: 0;
}
.otc-tag {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 700; letter-spacing: .06em;
  color: var(--gold); background: rgba(245,197,24,.12);
  border: 1px solid rgba(245,197,24,.3);
  border-radius: 4px; padding: 1px 7px;
  flex-shrink: 0;
}

/* ── PICK ROW ── */
.pick-row {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 14px;
  border-bottom: 1px solid rgba(255,255,255,.04);
}
.pick-row:last-child { border-bottom: none; }
.pick-row.captain { background: rgba(245,197,24,.05); }
.pick-row.empty { opacity: .4; }
.pick-idx {
  font-size: 11px; color: var(--muted); min-width: 20px; flex-shrink: 0;
}
.pick-avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--dark4);
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; color: var(--muted);
  overflow: hidden; flex-shrink: 0;
}
.pick-avatar img { width: 100%; height: 100%; object-fit: cover; }
.pick-name {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 15px; font-weight: 700;
  flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pick-name.gold { color: var(--gold); }
.pick-pos-wrap { display: flex; gap: 3px; flex-shrink: 0; }
.pos-chip {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 800; font-size: 10px;
  padding: 1px 5px; border-radius: 3px;
}
.pos-chip.pri { background: rgba(245,197,24,.15); color: var(--gold); }
.pos-chip.sec { background: rgba(245,197,24,.06); color: rgba(245,197,24,.45); }
.pick-ovr {
  font-family: 'Barlow Condensed', sans-serif;
  font-weight: 900; font-size: 12px;
  border-radius: 4px; padding: 1px 6px;
  color: rgba(0,0,0,.85); flex-shrink: 0;
}

/* ── CAPTAIN STATUS BAR ── */
.cap-bar {
  background: var(--dark2);
  border-top: 1px solid var(--border);
  padding: 8px 24px;
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0; height: 52px;
}
.cap-bar-label {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 10px; font-weight: 700;
  letter-spacing: 1.2px; color: var(--muted);
  text-transform: uppercase; flex-shrink: 0;
}
.cap-item {
  display: flex; align-items: center; gap: 7px;
  background: var(--dark3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 12px;
  flex: 1;
}
.cap-avatar {
  width: 24px; height: 24px; border-radius: 50%;
  background: var(--dark4); overflow: hidden; flex-shrink: 0;
}
.cap-avatar img { width: 100%; height: 100%; object-fit: cover; }
.cap-name { font-family: 'Barlow Condensed', sans-serif; font-size: 14px; font-weight: 700; flex: 1; }
.cap-team { font-size: 10px; color: var(--muted); }
.cap-status { font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 4px; }
.cap-status .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

/* ── DONE / WAITING STATES ── */
.state-center {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 16px;
}
.done-banner {
  text-align: center;
  background: var(--dark2);
  border: 2px solid var(--gold);
  border-radius: 12px;
  padding: 40px 60px;
  box-shadow: 0 0 40px rgba(245,197,24,.12);
}
.done-banner h1 {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 4rem; font-weight: 900;
  color: var(--gold); letter-spacing: 3px;
}

/* ── ANIMATIONS ── */
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
@keyframes urgentPulse { from{opacity:1} to{opacity:.5} }
@keyframes ticker { from{transform:translateX(0)} to{transform:translateX(-50%)} }
@keyframes slideIn { from{opacity:0;transform:translateY(-6px)} to{opacity:1;transform:none} }
.new-item { animation: slideIn .35s ease; }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="topbar">
    <div class="live-dot" id="live-dot"></div>
    <div class="topbar-logo">🏀 NBA 2K Liga</div>
    <div style="width:1px;height:20px;background:var(--border)"></div>
    <div class="topbar-title" id="draft-title">Draft</div>
    <div class="topbar-status" id="status-badge">Łączenie...</div>
    <div class="otc-strip" id="otc-strip" style="display:none">
      <div>
        <div class="otc-label">⏰ On the Clock</div>
        <div class="otc-team-name" id="otc-name">—</div>
        <div class="otc-pick-info" id="otc-info"></div>
      </div>
      <div style="width:1px;height:36px;background:var(--border)"></div>
      <div style="text-align:center">
        <div class="otc-label">Czas</div>
        <div class="timer-big" id="timer-val">—</div>
      </div>
      <div style="width:1px;height:36px;background:var(--border)"></div>
      <div class="last-pick-strip" id="last-pick-strip" style="display:none">
        <div class="last-pick-lbl">Ostatni pick</div>
        <div class="last-pick-name" id="last-pick-name">—</div>
        <div class="last-pick-team" id="last-pick-team"></div>
      </div>
    </div>
  </div>

  <div id="ticker-wrap" style="display:none">
    <div class="ticker"><div class="ticker-inner" id="ticker-inner"></div></div>
  </div>

  <div id="content"></div>

  <div class="cap-bar" id="cap-bar" style="display:none">
    <div class="cap-bar-label">Kapitanowie</div>
    <div id="cap-items" style="display:flex;gap:8px;flex:1"></div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════
const params     = new URLSearchParams(location.search);
const WORKER_URL = (params.get('w') || '').replace(/\/+$/, '');
const EVENT_ID   = params.get('event') || '';
const POLL_MS    = 2500;
if (params.get('bg') === 'transparent') document.body.style.background = 'transparent';

let evData = null, prevTurn = -1, timerInterval = null;
let _rankMap = {};

// ═══════════════════════════════════════════════════════
// OVR ENGINE
// ═══════════════════════════════════════════════════════
function gradeToNum(g) {
  return {'A+':13,'A':12,'A-':11,'B+':10,'B':9,'B-':8,'C+':7,'C':6,'C-':5,'D+':4,'D':3,'D-':2,'F':1}[(g||'').toUpperCase()]||0;
}
function buildRanking(matches, method, overrides) {
  const sm = {};
  (matches||[]).forEach(m => {
    [...(m.team1?.players||[]),...(m.team2?.players||[])].forEach(pl => {
      if (!pl.name) return;
      const pos = pl.pos || 'SF';
      const key = pl.name + '\x00' + pos;
      if (!sm[key]) sm[key] = {name:pl.name,pos,gp:0,pts:0,reb:0,ast:0,stl:0,blk:0,to:0,fgm:0,fga:0,ftm:0,fta:0,gs:0};
      const s = sm[key];
      s.gp++; s.pts+=pl.pts||0; s.reb+=pl.reb||0; s.ast+=pl.ast||0;
      s.stl+=pl.stl||0; s.blk+=pl.blk||0; s.to+=pl.to||0;
      s.fgm+=pl.fgm||0; s.fga+=pl.fga||0; s.ftm+=pl.ftm||0; s.fta+=pl.fta||0;
      s.gs+=gradeToNum(pl.grade||'B');
    });
  });
  const players = Object.values(sm).map(s => {
    const gp=s.gp, mat=gp/(gp+5);
    const ppg=s.pts/gp, rpg=s.reb/gp, apg=s.ast/gp, spg=s.stl/gp, bpg=s.blk/gp;
    const per=((s.pts+s.reb+s.ast+s.stl+s.blk-(s.fga-s.fgm)-(s.fta-s.ftm)-s.to)/gp);
    const cs=(Math.min(ppg/50,1)*100*.25+Math.min(spg/4,1)*100*.20+Math.min(bpg/3,1)*100*.18+Math.min(rpg/20,1)*100*.15+Math.min(apg/15,1)*100*.12)*mat;
    return {...s,per,cs,gp};
  });
  const m = method||'top98';
  if (m==='top98') {
    const byPos={};
    players.forEach(p=>{(byPos[p.pos]||(byPos[p.pos]=[])).push(p);});
    const comp=p=>(p.per*.6+p.cs*.4)*(.5+.5*p.gp/(p.gp+5));
    return players.map(p=>{
      const mx=Math.max(...(byPos[p.pos]||[p]).map(comp),.01);
      const ovr=Math.max(40,Math.min(98,Math.round(40+comp(p)/mx*58)));
      return {...p,ovr:(overrides||{})[p.name]??ovr};
    });
  }
  const sP=players.map(p=>p.per).sort((a,b)=>a-b);
  const pct=(arr,v)=>arr.length<=1?50:arr.filter(x=>x<v).length/(arr.length-1)*100;
  return players.map(p=>{
    const raw=pct(sP,p.per)*.45+Math.min(p.gp*2,10)*.05;
    return {...p,ovr:(overrides||{})[p.name]??Math.max(40,Math.min(99,Math.round(raw*.59+40)))};
  });
}
function buildRankMap(ranking) {
  _rankMap = {};
  ranking.forEach(r=>{ if(!_rankMap[r.name]) _rankMap[r.name]=r; });
}
function getOvr(player) {
  if (player?.ovr) return player.ovr;
  const nm = (player?.name||'').toLowerCase();
  const k = Object.keys(_rankMap).find(k=>k.toLowerCase()===nm);
  return k ? _rankMap[k].ovr : null;
}

// ═══════════════════════════════════════════════════════
// FETCH
// ═══════════════════════════════════════════════════════
async function fetchData() {
  if (!WORKER_URL) return null;
  try {
    const res = await fetch(WORKER_URL + '/data');
    if (!res.ok) return null;
    const d = await res.json();
    const rec = d.record || d;
    if ((rec.matches||[]).length) {
      buildRankMap(buildRanking(rec.matches, rec.ovrMethod||'top98', rec.ovrOverrides||{}));
    }
    return (rec.events||[]).find(e=>e.id===EVENT_ID)||null;
  } catch(e) { return null; }
}

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function ovrColor(ovr) {
  if (ovr>=90) return '#4ade80';
  if (ovr>=80) return '#a3e635';
  if (ovr>=70) return '#facc15';
  if (ovr>=60) return '#fb923c';
  return '#f87171';
}
function posBadges(player) {
  const all = player.positions?.length ? player.positions
    : (player.primaryPos?[player.primaryPos]:(player.pos?[player.pos]:[]));
  if (!all.length) return '';
  const pri = player.primaryPos || all[0];
  return `<div class="pick-pos-wrap">${all.map(p=>`<span class="pos-chip ${p===pri?'pri':'sec'}">${p}</span>`).join('')}</div>`;
}
function avatarEl(src, fallback='') {
  return src
    ? `<div class="pick-avatar"><img src="${src}" onerror="this.parentNode.innerHTML='${fallback}'"></div>`
    : `<div class="pick-avatar" style="font-size:10px;color:var(--muted)">${fallback}</div>`;
}
function getRound(turn, order, teams) {
  return !teams.length ? 1 : Math.floor(turn/teams.length)+1;
}

// ═══════════════════════════════════════════════════════
// TIMER
// ═══════════════════════════════════════════════════════
function startTimer(endsAt) {
  clearInterval(timerInterval);
  const el = document.getElementById('timer-val');
  if (!el || !endsAt) return;
  timerInterval = setInterval(()=>{
    const left = Math.max(0, Math.round((new Date(endsAt)-Date.now())/1000));
    el.textContent = String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');
    el.className = 'timer-big'+(left<=10?' urgent':left<=30?' warning':'');
    if (left===0) clearInterval(timerInterval);
  }, 500);
}
function stopTimer() {
  clearInterval(timerInterval);
  const el = document.getElementById('timer-val');
  if (el) el.textContent = '—';
}

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════
function render(ev) {
  const isDraft  = ev.status === 'draft';
  const isDone   = ev.status === 'active' || ev.status === 'closed_done';
  const isPaused = ev.draftPaused && isDraft;
  const isClosed = ev.status === 'closed';
  const turn     = ev.draftTurn || 0;
  const order    = ev.draftOrder || [];
  const teams    = ev.teams || [];
  const isNewTurn = turn !== prevTurn;

  const currentTeamIdx = isDraft && !isDone && turn < order.length ? order[turn] : -1;
  const currentTeam    = currentTeamIdx >= 0 ? teams[currentTeamIdx] : null;
  const lastPick       = ev.lastPick || null;
  const perTeam        = teams.length ? Math.round(order.length/teams.length) : 0;
  const gmOnline       = ev.gmOnline || [];

  // ── Topbar
  document.getElementById('draft-title').textContent = ev.title || 'Draft';

  const badge = document.getElementById('status-badge');
  if (isDraft && !isPaused) { badge.textContent='LIVE'; badge.className='topbar-status live'; }
  else if (isPaused)         { badge.textContent='WSTRZYMANY'; badge.className='topbar-status paused'; }
  else if (isClosed)         { badge.textContent='OCZEKIWANIE'; badge.className='topbar-status'; }
  else                       { badge.textContent='ZAKOŃCZONY'; badge.className='topbar-status'; }

  document.getElementById('live-dot').style.cssText =
    `background:${isDraft&&!isPaused?'var(--green)':isPaused?'var(--orange)':'var(--muted)'};` +
    `animation:${isDraft&&!isPaused?'pulse 1.4s infinite':'none'}`;

  // OTC strip
  const otcStrip = document.getElementById('otc-strip');
  if (currentTeam && !isPaused) {
    otcStrip.style.display = '';
    document.getElementById('otc-name').textContent = currentTeam.name;
    document.getElementById('otc-info').textContent =
      `Pick ${turn+1} z ${order.length} · Runda ${getRound(turn,order,teams)}`;
    if (!ev.timerEnd) document.getElementById('timer-val').textContent = '∞';
  } else {
    otcStrip.style.display = 'none';
    stopTimer();
  }

  // Last pick
  const lps = document.getElementById('last-pick-strip');
  if (lastPick) {
    lps.style.display = '';
    document.getElementById('last-pick-name').textContent = lastPick.playerName || '—';
    document.getElementById('last-pick-team').textContent = `${lastPick.teamName||''} · Pick #${lastPick.pickNum||''}`;
  } else { lps.style.display = 'none'; }

  // ── Ticker
  const allPicked = [];
  teams.forEach(t => (t.players||[]).forEach(p=>{ if(p.id!==t.captain?.id) allPicked.push({name:p.name,team:t.name}); }));
  const tickerWrap = document.getElementById('ticker-wrap');
  if (allPicked.length) {
    tickerWrap.style.display = '';
    const items = [...allPicked,...allPicked].map((p,i)=>
      `<span class="ticker-item"><span class="tn">#${(i%allPicked.length)+1}</span> <span class="tp">${p.name}</span> → <span class="tt">${p.team}</span></span>`
    ).join('');
    document.getElementById('ticker-inner').innerHTML = items;
  } else { tickerWrap.style.display = 'none'; }

  // ── Content
  const content = document.getElementById('content');

  if (isDone) {
    content.innerHTML = `<div class="state-center">
      <div class="done-banner">
        <div style="font-size:4rem;margin-bottom:10px">🏆</div>
        <h1>DRAFT ZAKOŃCZONY!</h1>
        <div style="color:var(--muted);margin-top:10px;font-size:1rem">Wszystkie drafty zostały wykonane</div>
      </div>
      ${teams.length ? renderBoardGrid(teams, -1, perTeam, gmOnline, true) : ''}
    </div>`;
  } else if (isClosed && !isDraft) {
    content.innerHTML = `<div class="state-center">
      <div class="done-banner" style="border-color:var(--muted)">
        <div style="font-size:3rem;margin-bottom:10px">⏳</div>
        <h1 style="color:var(--muted);font-size:2.5rem">OCZEKIWANIE NA START</h1>
        <div style="color:var(--muted);margin-top:8px">Admin zaraz uruchomi draft</div>
      </div>
    </div>`;
  } else if (isPaused) {
    content.innerHTML = `<div class="board-section">
      <div class="board-label">⏸ DRAFT WSTRZYMANY — <span style="color:var(--orange)">Admin wstrzymał draft</span></div>
      ${renderBoardGrid(teams, currentTeamIdx, perTeam, gmOnline, false)}
    </div>`;
  } else {
    content.innerHTML = `<div class="board-section">
      <div class="board-label">🏀 DRAFT BOARD</div>
      ${renderBoardGrid(teams, currentTeamIdx, perTeam, gmOnline, false)}
    </div>`;
  }

  // ── Captain status bar
  const capBar = document.getElementById('cap-bar');
  const capItems = document.getElementById('cap-items');
  if (teams.length && !isDone) {
    capBar.style.display = '';
    capItems.innerHTML = teams.map(t => {
      const isOnline = gmOnline.includes(t.id) || gmOnline.includes(t.captain?.id);
      return `<div class="cap-item">
        ${t.captain?.avatar ? `<div class="cap-avatar"><img src="${t.captain.avatar}"></div>` : `<div class="cap-avatar" style="font-size:9px;color:var(--muted)">${(t.captain?.name||'?')[0]}</div>`}
        <div style="flex:1;min-width:0">
          <div class="cap-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.captain?.name||'—'}</div>
          <div class="cap-team" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.name}</div>
        </div>
        <div class="cap-status">
          <div class="dot" style="background:${isOnline?'var(--green)':'var(--muted)'}"></div>
          <span style="color:${isOnline?'var(--green)':'var(--muted)'}">${isOnline?'Online':'Offline'}</span>
        </div>
      </div>`;
    }).join('');
  } else { capBar.style.display = 'none'; }

  // Timer
  if (isNewTurn && ev.timerEnd && isDraft && !isPaused) startTimer(ev.timerEnd);
  else if (!isDraft || isPaused) stopTimer();

  prevTurn = turn;
}

function renderBoardGrid(teams, currentTeamIdx, perTeam, gmOnline, compact) {
  const cols = Math.min(teams.length, 5);
  let html = `<div class="board-grid" style="grid-template-columns:repeat(${cols},1fr)">`;
  teams.forEach((t, ti) => {
    const isOtc    = ti === currentTeamIdx;
    const picked   = (t.players||[]).filter(p=>p.id!==t.captain?.id);
    const logo     = t.logoB64 ? `<img src="${t.logoB64}">` : (t.name||'?')[0];
    const isOnline = gmOnline.includes(t.id) || gmOnline.includes(t.captain?.id);
    const captOvr  = getOvr(t.captain||{});

    html += `<div class="team-card ${isOtc?'otc':''}">
      <div class="team-card-head">
        <div class="team-logo">${logo}</div>
        <div style="flex:1;min-width:0">
          <div class="team-name">${t.name}</div>
          <div class="captain-tag">${t.captain?.name||'—'}</div>
        </div>
        <div class="online-dot" style="background:${isOnline?'var(--green)':'var(--muted)'}" title="${isOnline?'Online':'Offline'}"></div>
        ${isOtc?'<span class="otc-tag">ON CLOCK</span>':''}
      </div>`;

    // Captain row
    html += `<div class="pick-row captain">
      <span class="pick-idx" style="color:var(--gold)">★</span>
      ${avatarEl(t.captain?.avatar, (t.captain?.name||'?')[0])}
      <span class="pick-name gold">${t.captain?.name||'—'}</span>
      ${posBadges(t.captain||{})}
      ${captOvr?`<span class="pick-ovr" style="background:${ovrColor(captOvr)}">${captOvr}</span>`:''}
      <span style="font-size:10px;color:var(--muted);margin-left:2px">kpt</span>
    </div>`;

    // Picks
    for (let i=0; i<perTeam; i++) {
      const p = picked[i];
      if (p) {
        const ovr = p.ovr || getOvr(p);
        html += `<div class="pick-row new-item">
          <span class="pick-idx">${i+1}</span>
          ${avatarEl(p.avatar, (p.name||'?')[0])}
          <span class="pick-name">${p.name}</span>
          ${posBadges(p)}
          ${ovr?`<span class="pick-ovr" style="background:${ovrColor(ovr)}">${ovr}</span>`:''}
        </div>`;
      } else {
        html += `<div class="pick-row empty">
          <span class="pick-idx">${i+1}</span>
          <div class="pick-avatar"></div>
          <span class="pick-name" style="color:var(--muted)">— wolny slot</span>
        </div>`;
      }
    }
    html += `</div>`;
  });
  html += `</div>`;
  return html;
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
async function init() {
  if (!WORKER_URL || !EVENT_ID) {
    document.getElementById('content').innerHTML = `<div class="state-center">
      <div style="text-align:center">
        <div style="font-size:3rem;margin-bottom:12px">⚠️</div>
        <div style="font-family:'Barlow Condensed',sans-serif;font-size:1.8rem;font-weight:900;color:var(--muted)">Brak parametrów URL</div>
        <div style="color:var(--muted);margin-top:8px;font-size:.85rem">
          URL musi zawierać <code style="color:var(--gold)">?w=WORKER_URL&amp;event=EVENT_ID</code><br>
          Skopiuj link z przycisku <b>📺 Overlay</b> w panelu admina draftu.
        </div>
      </div>
    </div>`;
    return;
  }

  const ev = await fetchData();
  if (ev) { evData = ev; render(ev); }

  setInterval(async () => {
    const fresh = await fetchData();
    if (!fresh) return;
    const changed = !evData
      || fresh.draftTurn   !== evData.draftTurn
      || fresh.status      !== evData.status
      || fresh.timerEnd    !== evData.timerEnd
      || fresh.draftPaused !== evData.draftPaused
      || JSON.stringify(fresh.gmOnline) !== JSON.stringify(evData.gmOnline)
      || (fresh.teams||[]).some((t,i)=>(t.players||[]).length !== ((evData.teams||[])[i]?.players||[]).length);
    evData = fresh;
    if (changed) render(fresh);
  }, POLL_MS);
}

init();
</script>
